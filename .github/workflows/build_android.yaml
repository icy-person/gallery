name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'

jobs:
  build_apk:
    name: Build Android x86_64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - name: Prepare stable release signing key
        if: github.event_name != 'pull_request'
        working-directory: ./Android/src
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 GitHub secret is required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/gallery-signing"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gallery-signing/release.keystore"
          test -s "$RUNNER_TEMP/gallery-signing/release.keystore"

      - name: Build x86_64 signed Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/gallery-signing/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build x86_64 Debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-x86_64
          path: Android/src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
