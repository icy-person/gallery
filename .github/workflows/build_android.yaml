name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Android/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'

jobs:
  build_apk:
    name: Build Android x86_64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - name: Build x86_64 Debug APK
        run: ./gradlew assembleDebug

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-x86_64
          path: Android/src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
